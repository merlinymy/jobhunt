[project]
name = "jobhunt"
version = "0.1.0"
description = "Personal job-search pipeline: discover, score, tailor a packet, track outcomes."
requires-python = ">=3.12"

# Four libraries plus our own code. Telegram is long-polled with stdlib urllib —
# a bot wrapper is not worth a dependency for one sendMessage and one getUpdates.
dependencies = [
  "fastapi>=0.115",         # dashboard
  "uvicorn>=0.30",          # dashboard server
  "pydantic>=2.7",          # request bodies on /api (a FastAPI dep already)
  "pyyaml>=6.0",            # docs/profile/*.yaml, config/models.yaml
]

[project.optional-dependencies]
# Installed when the phase lands, not before. Keeps the dashboard install light.
llm = ["anthropic>=0.40"]                      # Phase 2/4/5 — llm.py
# The `full` extra is not optional for us: plain `rendercv` ships the schema and
# the Jinja templates but not typst, and without typst there is no PDF.
resume = [
  "rendercv[full]>=2.8",                       # Phase 2 — master data -> PDF
  "python-docx>=1.1",                          # Phase 2 — the .docx master renderer
]
# 1.1.82 is what a working sweep was verified against. Of the four US sources it
# exposes, only Indeed returns anything — see config/searches.yaml.
ingest = ["python-jobspy>=1.1.82"]             # Phase 4 — discovery
inbox = [                                      # Phase 5 — Gmail poller
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt"]
