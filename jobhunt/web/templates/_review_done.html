{# Replaces a card once decided. Kept in place rather than vanishing so the
   decision is visible and an accidental click is obvious immediately. #}
<article class="review-card decided {{ outcome }}">
  <span>{{ '✅ Approved' if outcome == 'approved' else '⏭ Skipped' }} — {{ title }}</span>
  {% if outcome == 'approved' %}
    <a class="quiet" href="/applications/{{ application_id }}">open</a>
  {% endif %}
</article>
