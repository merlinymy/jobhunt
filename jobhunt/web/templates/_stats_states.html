<div id="stats-states">
  <table class="sortable-table">
    {% include "_sort_header.html" %}
    <tbody>
      {% for r in table.rows %}
      <tr>
        <td><span class="pill {{ r.state }}">{{ r.state.replace('_', ' ') }}</span></td>
        <td class="num">{{ r.count }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
