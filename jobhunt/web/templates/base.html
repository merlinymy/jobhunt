<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}jobhunt{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/">jobhunt</a>
      <a href="/" {% if page == 'pipeline' %}class="on"{% endif %}>Pipeline</a>
      <a href="/applications/new" {% if page == 'new' %}class="on"{% endif %}>Log application</a>
      <a href="/stats" {% if page == 'stats' %}class="on"{% endif %}>Stats</a>
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
