# Model routing. Change a value here, not a call site — llm.py reads this.
# Measured cost at ~100 applications/month: all-opus ~$14, haiku-bulk mixed ~$8.

provider: anthropic          # anthropic | ollama  (ollama unimplemented; see note below)

# $/million tokens. The API does not return a price, so `llm_calls.cost_usd` is
# reconstructed from these. They used to live in a dict in llm.py alongside a
# comment here saying the same thing in prose, which is two copies to keep in
# step and one of them unenforced — the sonnet line below was already dated to
# expire while the code held the intro rate with no way to notice.
#
# A model routed above but missing here is refused before the call is made.
# Logging $0.00 for it would be worse: the spend just disappears.
rates:
  claude-opus-5:
    input: 5.0
    output: 25.0
  claude-sonnet-5:
    input: 3.0
    output: 15.0
    # Introductory pricing. llm.py applies this only through `through`, then
    # falls back to the standard rate above with no edit needed here.
    intro: {input: 2.0, output: 10.0, through: "2026-08-31"}
  claude-haiku-4-5-20251001:
    input: 1.0
    output: 5.0

# Sizing max_tokens: on Opus 5 the budget covers reasoning *and* the reply, and
# reasoning is on by default. A budget sized from the visible output alone will
# truncate. Leaving reasoning off is not the fix — with it disabled the model
# sometimes writes <thinking> tags into the response, which breaks any caller
# parsing JSON out of it. Budget generously instead; you are billed for tokens
# produced, not for the ceiling. llm.py raises on a truncated reply rather than
# handing back half a JSON object.

tasks:
  select:
    # The library selection call (Phase 1 redesign): emits {variant, bullet_ids,
    # trims} only — it picks from pre-approved lines, it does not compose, so it
    # runs below the tailor tier. Sonnet to start; raise to opus if selection
    # quality needs it. Title and skills are deterministic post-processing in
    # select.py, never model output. The library block is cached every call.
    model: claude-sonnet-5
    max_tokens: 4000
    cache_profile: true
  tailor:
    model: claude-opus-5     # quality-critical, ~100 calls/mo, drives callbacks
    # 2000 truncated at the dashboard's own limit ceiling of 30 bullets, and a
    # 10-bullet call already used 1562. 30 long bullets plus reasoning needs
    # roughly 5k; 8000 leaves room for a corpus that keeps growing.
    max_tokens: 8000
    cache_profile: true      # profile corpus is identical every call
  tailor_check:
    # Reads each emitted line against its own source row and says whether the
    # claim is supported. Sonnet because this is a comparison, not composition —
    # and measured at ~1.5k in / 400 out it adds 5% to a packet, or 69c a month.
    #
    # Deliberately a *different* model from `tailor`. Two calls to one model
    # share its blind spots: a fabrication Opus finds plausible enough to write,
    # Opus finds plausible enough to pass. This is the cheapest decorrelation
    # available, and the reason not to "save a call" by asking Opus to check
    # itself in the same reply.
    model: claude-sonnet-5
    # 2000 was sized from the JSON reply alone — about 400 tokens — and truncated
    # on the first real packet, which is exactly the mistake the note above this
    # block describes. The budget covers reasoning too, and this task reasons per
    # pair: ten lines each compared against their own source is ten separate
    # judgements before a word of the reply is written. Sized generously because
    # you are billed for tokens produced, not for the ceiling, and because a
    # truncated reply here fails the packet rather than degrading it.
    max_tokens: 8000
    cache_profile: false     # the corpus is not sent — see config/prompts/tailor_check.md
  form_answers:
    # Every free-text box on one form, five options each, in one call. Batched
    # rather than one call per question so the options can differ across the set
    # instead of five answers all reaching for the same best bullet — and so the
    # corpus is cached once for the form rather than once per question.
    #
    # The output is the largest of any task here: five answers times however many
    # boxes the form has. 12000 is sized for a long form, and you are billed for
    # what is produced, not for the ceiling.
    model: claude-opus-5
    max_tokens: 12000
    cache_profile: true
  gaps:
    # Runs once per application, before tailoring, and its answer is stored — it
    # depends only on (posting, corpus), and neither changes between a build and
    # its rebuilds. So this is a handful of calls a day, not one per rebuild.
    #
    # Opus because the useful half is a judgement call, not a lookup: deciding
    # that "deployed containerised services behind a tunnel and kept them alive
    # across reboots" is the honest answer to a posting asking for AWS is exactly
    # the reasoning a cheaper tier flattens into keyword overlap. A weak answer
    # here is worse than none — it puts a stretch in front of an interviewer.
    model: claude-opus-5
    # 4000 truncated on the first real posting. The budget covers reasoning, and
    # this task reasons per gap: each one is a pass over the whole corpus asking
    # "is there anything adjacent to this", before a word of the reply is
    # written. Same shape as tailor_check, and the same lesson — you are billed
    # for tokens produced, not for the ceiling, so size it generously.
    max_tokens: 8000
    cache_profile: true      # the corpus block is the same one `tailor` sends
  tailor_revise:
    # Conversational revision of a built resume, and deliberately **the same
    # prompt as `tailor`** rather than one of its own. The chat replays the
    # build's actual exchange as prior turns, so the model is continuing the
    # conversation that wrote the resume — it already has the rules, its own
    # output, and the reasoning it wrote at the time. A second system prompt
    # would be a copy of the first that goes stale, and swapping the system
    # prompt underneath a conversation is not "the same session" in any sense
    # that matters.
    #
    # It stays a separate task key only so `llm_calls` can tell a revision from
    # a build. Same file, same model, same ceiling; different row in the ledger,
    # which is what keeps the output-token comparison in prompts/README.md
    # honest.
    system_prompt: prompts/tailor.md
    model: claude-opus-5
    max_tokens: 8000         # emits a full resume plus reasoning, same as tailor
    cache_profile: true      # same corpus every turn, byte-identical
  narrative:
    model: claude-opus-5     # "why this company"; cached per company after first call
    max_tokens: 4000         # same reasoning-shares-the-budget rule as tailor
    cache_profile: true
  score:
    model: claude-haiku-4-5-20251001   # ~600 calls/mo, I review the ranking anyway
    # Haiku 4.5 does not reason unless asked, so this budget is the reply only.
    # Still tight for a score plus a sentence of reasoning — revisit when Phase 4
    # lands and there is real output to measure.
    max_tokens: 200
    cache_profile: true
    batch: true              # not latency-sensitive; runs before the 8am digest
  classify_email:
    model: claude-haiku-4-5-20251001
    max_tokens: 100
    batch: false             # hourly, low volume, keep it simple

# `cache_profile: true` means the corpus prefix is *cacheable*, not that every
# call should write a cache entry. Whether that pays depends entirely on spacing:
# a write bills at 125% of base input and a read at 10%, on a 5-minute TTL, so
# the break-even is two calls inside the window. For the ~10k-token corpus:
#
#   isolated call, no caching     10445 tok x $5/M            = $0.052
#   isolated call, cache written  x1.25, never read           = $0.065   <- a loss
#   five in a burst, cached       1.25 + 4x0.1 of one call    = $0.070   vs $0.261
#
# So the caller declares it, not the config: llm.complete(..., expect_repeat=)
# defaults to True for the batch workers and is False on the dashboard's
# single-JD path, which would otherwise pay the premium on every one-off tailor
# and never once read the entry back.
#
# Cost levers, in order of actual impact for this workload:
#   1. Prompt caching — the profile corpus is byte-identical across all 700 calls/mo.
#      Cache hits bill at 10% of base input. Bigger lever than model tier.
#   2. Batch API — 50% off, stacks with caching. Scoring is the obvious candidate.
#   3. Model tier — only worth touching if 1 and 2 aren't enough.
#
# Swapping to local later: implement an `ollama` provider behind the same
# complete(task, prompt) signature and flip `provider`. Do NOT build that
# abstraction now — just never hardcode a model ID outside this file.
