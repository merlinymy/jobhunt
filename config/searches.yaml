# Board pacing is NOT set here. It lives in `boards._MIN_INTERVAL`, keyed by
# host, because a single number here would pace the loop rather than any one
# vendor — nineteen Ashby boards in a row would still arrive back to back.
#
# Current policy, per host: 1 request/second with jitter, 3 attempts, honouring
# Retry-After, retrying only 429/5xx and never a 404. Ashby's unauthenticated
# posting API has an unofficial ceiling near 100/min and Greenhouse documents
# none — which is not permission — so 60/min per host is an order of magnitude
# under anything published. A 429 abandons that vendor for the rest of the run
# instead of pushing harder; the source has to still work tomorrow.
