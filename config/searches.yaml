# What `make ingest` searches for. Read by jobhunt/ingest.py.
#
# Why this is not in docs/profile/scoring.yaml: these are query strings tuned for
# one job board, not facts about me. `scoring.yaml` holds `title_keywords`, which
# look similar and are not the same thing — those are substring *filters* applied
# to titles that come back, and using them as queries would search Indeed for
# "engineer" and return mechanical and civil roles all day. Filtering stays in
# `score`; this file only decides what gets pulled.
#
# ---------------------------------------------------------------------------
# Source reality, measured 2026-08-03. Of the four US sources JobSpy exposes,
# exactly one returned anything:
#
#   indeed         8/8 rows, every one with a direct ATS URL and a description
#   google         0 rows — "initial cursor not found" on every phrasing tried
#   zip_recruiter  0 rows
#   glassdoor      0 rows
#
# docs/architecture.md says "Indeed, Google". Google is dead, so Indeed is the
# whole discovery pipeline right now. That is a single point of failure, and
# CLAUDE.md's "Aggregator staleness" note — polling Greenhouse/Lever/Ashby JSON
# for a seeded company list — is the answer if Indeed follows. LinkedIn is not
# an option here and never will be; see the non-goals.
#
# Re-check the dead ones occasionally by adding them to `sites` and watching the
# per-source counts. Nothing breaks if a source returns nothing.
# ---------------------------------------------------------------------------

sites: [indeed]

# Only postings newer than this are pulled. Two runs a day at 168h means every
# posting is seen ~14 times; `apply_url_norm` makes the repeats free, and the
# window matters more than the frequency for anything posted over a weekend.
hours_old: 168

# Per search term, per location. Indeed paginates, so this is roughly a cap on
# how deep to go rather than a promise.
results_wanted: 40

# Real query strings, not filter keywords. Broad enough that the title filter in
# `score` has something to work on, narrow enough not to pull another field.
terms:
  - software engineer
  - full stack developer
  - backend engineer
  - frontend engineer

# Searched in order. `remote: true` runs the term with no geography and Indeed's
# remote flag set; everything else is a metro string Indeed understands. These
# mirror docs/profile/scoring.yaml `location_rank`, which is what orders the
# digest — but note the digest ranks and never rejects, so this list being
# shorter than that one only means fewer places are searched, not filtered.
locations:
  - {remote: true}
  - {city: "San Francisco, CA"}
  - {city: "Oakland, CA"}
  - {city: "San Jose, CA"}
  - {city: "Los Angeles, CA"}
  - {city: "Boston, MA"}
  - {city: "Chicago, IL"}
  - {city: "Seattle, WA"}
  - {city: "Atlanta, GA"}

# Seconds between Indeed searches, jittered by up to +50% so two runs a day are
# not an identifiable metronome. This is the one source that can ban us — it is
# a scrape, not an API — and 36 searches at 8s is five minutes for a job that
# runs unattended twice a day. There is nothing to gain by going faster.
#
# Raise it if runs start coming back empty from queries that used to work. The
# scraper reports throttling as zero rows rather than an error, so `ingest`
# treats four consecutive empty searches as being refused and stops the sweep
# rather than grinding through thirty more while blocked.
delay_seconds: 8

# ---------------------------------------------------------------------------
# Direct ATS board polling — the second source, and the durable one.
#
# These are the vendors' own public JSON endpoints, meant to be read by other
# software. No scraping, no bot detection, nothing to break when a page's markup
# changes. Where a keyword search can miss a posting whose title used a word I
# did not think of, a board poll returns the entire board — so filtering happens
# in `score`, where it is reviewable, instead of silently at the query.
#
# The seed list below was not invented. Every slug was harvested from a real
# Indeed sweep on 2026-08-03: 28 Greenhouse boards recovered by following
# `grnh.se` short links (which carry the posting id, not the company), plus the
# Lever and Ashby slugs that appeared directly in apply URLs. Add companies you
# want to watch regardless of whether they ever show up on Indeed — that is the
# real reason to keep this list by hand.
#
# A 404 is the ordinary way a board dies: renamed, migrated, or the company was
# acquired. `make ingest` reports those per run rather than failing the sweep.
# ---------------------------------------------------------------------------

boards:
  greenhouse:
    - andurilindustries
    - astranis
    - axs
    - colabsoftware
    - drweng
    - earnin
    - flip
    - goguardian
