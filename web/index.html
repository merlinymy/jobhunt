<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>jobhunt</title>
    <!--
      Blocking, and before the module script, on purpose. The server used to
      render <html data-theme> so the first paint was already correct; with a
      static index.html the only way to keep that is to set the attribute before
      the browser paints. Skipping this is how a dark-mode app ships a white flash.
    -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
